services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?missing DB password}
      POSTGRES_DB: notes
    volumes:
      - ci_notes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d notes"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    image: ${IMAGE_REF:?missing image ref}
    environment:
      DATABASE_URL: postgresql://labuser:${DB_PASSWORD:?missing DB password}@db:5432/notes
      INSTANCE_ID: ci-local
    ports:
      - "127.0.0.1:18083:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  ci_notes_data:
