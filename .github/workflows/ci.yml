name: CI/CD
on:
  push:
    branches: [lab3-ci]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py tests
      - run: python -m unittest discover -s tests -v
  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: notes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notes:ci
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Show HIGH and CRITICAL totals
        run: python tools/trivy_counts.py trivy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: trivy.json
          retention-days: 7
      - name: Security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notes:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
          skip-setup-trivy: true
      - name: Publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker tag notes:ci "ghcr.io/$OWNER_LOWER/cloud-devops-labs:$SHA"
          docker push "ghcr.io/$OWNER_LOWER/cloud-devops-labs:$SHA"
          docker logout ghcr.io
  deploy:
    needs: image
    runs-on: [self-hosted, Windows, X64, devops-lab]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy and check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          COMPOSE_PROJECT_NAME: devops-ci
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DB_PASSWORD) { throw 'CI_DB_PASSWORD secret is missing' }
          $env:IMAGE_REF = 'ghcr.io/' + $env:OWNER.ToLowerInvariant() + '/cloud-devops-labs:' + $env:SHA
          $env:GH_TOKEN | docker login ghcr.io -u $env:OWNER --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Registry login failed' }
          try {
            docker compose -f compose.ci.yaml up -d --pull always
            if ($LASTEXITCODE -ne 0) { throw 'Compose failed' }
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:18083/api/health' -TimeoutSec 3
                if ($response.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Health check failed' }
            Write-Output ('API response: ' + ($response | ConvertTo-Json -Compress))
          } finally { docker logout ghcr.io }
