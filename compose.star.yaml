services:
  db:
    restart: unless-stopped
    cpus: '0.75'
    mem_limit: 256m
    memswap_limit: 256m
  backend-a:
    restart: unless-stopped
    cpus: '0.75'
    mem_limit: 256m
    memswap_limit: 256m
  backend-b:
    restart: unless-stopped
    cpus: '0.75'
    mem_limit: 256m
    memswap_limit: 256m
  web:
    restart: unless-stopped
    cpus: '0.50'
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate --header='Host: notes.local' https://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
